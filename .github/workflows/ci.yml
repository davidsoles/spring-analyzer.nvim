name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Smoke test
        run: |
          nvim --headless --clean \
            --cmd "set rtp+=." \
            -c "luafile tests/smoke.lua" \
            -c "qa!"
